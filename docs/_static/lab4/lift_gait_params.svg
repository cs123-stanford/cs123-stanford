<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">One leg's foot cycle (lab 3's triangle) — what the four LIFT_* numbers set</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#666">Side view of one foot relative to its hip. Front of the robot is to the LEFT. Not to scale.</text>

  <!-- hip -->
  <circle cx="400" cy="90" r="9" fill="#333"/>
  <text x="416" y="95" font-size="15" fill="#333">hip</text>
  <line x1="450" y1="90" x2="790" y2="90" stroke="#999" stroke-dasharray="5,4"/>

  <!-- stance line extension -->
  <line x1="600" y1="330" x2="790" y2="330" stroke="#999" stroke-dasharray="5,4"/>

  <!-- triangle -->
  <polygon points="200,330 400,170 600,330" fill="none" stroke="#8b1a1a" stroke-width="2.5"/>
  <!-- keyframes -->
  <g fill="#fff" stroke="#8b1a1a" stroke-width="2">
    <circle cx="200" cy="330" r="8"/>
    <circle cx="300" cy="330" r="8"/>
    <circle cx="400" cy="330" r="8"/>
    <circle cx="500" cy="330" r="8"/>
    <circle cx="600" cy="330" r="8"/>
    <circle cx="400" cy="170" r="8"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="186" y="335" text-anchor="end">Touch Down</text>
    <text x="614" y="335">Lift-Off</text>
    <text x="400" y="158" text-anchor="middle">Mid-Swing</text>
    <text x="300" y="355" text-anchor="middle">Stand 1</text>
    <text x="400" y="355" text-anchor="middle">Stand 2</text>
    <text x="500" y="355" text-anchor="middle">Stand 3</text>
  </g>

  <!-- motion arrows -->
  <line x1="260" y1="372" x2="540" y2="372" stroke="#8b1a1a" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="400" y="388" text-anchor="middle" font-size="12" fill="#8b1a1a">stance: planted foot slides back (this is what pushes the body)</text>
  <line x1="560" y1="250" x2="510" y2="210" stroke="#8b1a1a" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <line x1="290" y1="210" x2="240" y2="250" stroke="#8b1a1a" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="535" y="200" font-size="12" fill="#8b1a1a">swing</text>
  <line x1="150" y1="110" x2="60" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="105" y="100" text-anchor="middle" font-size="13" fill="#333">body (trot)</text>

  <!-- LIFT_STANCE_Z -->
  <line x1="770" y1="94" x2="770" y2="326" stroke="#1f5fa8" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="760" y="190" text-anchor="end" font-size="15" font-weight="bold" fill="#1f5fa8">LIFT_STANCE_Z</text>
  <text x="760" y="208" text-anchor="end" font-size="12" fill="#1f5fa8">foot depth below hip (negative)</text>
  <text x="760" y="224" text-anchor="end" font-size="12" fill="#1f5fa8">lab 3: body height · trot: −0.14 m</text>

  <!-- LIFT_SWING_LIFT -->
  <line x1="400" y1="174" x2="400" y2="322" stroke="#1f7a3a" stroke-width="2" stroke-dasharray="1,0" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="408" y="236" font-size="15" font-weight="bold" fill="#1f7a3a">LIFT_SWING_LIFT</text>
  <text x="408" y="253" font-size="12" fill="#1f7a3a">rise above stance plane</text>
  <text x="408" y="269" font-size="12" fill="#1f7a3a">lab 3: step height · trot: 0.09 m</text>

  <!-- LIFT_STRIDE -->
  <line x1="200" y1="412" x2="200" y2="428" stroke="#a85a00" stroke-width="2"/>
  <line x1="400" y1="412" x2="400" y2="428" stroke="#a85a00" stroke-width="2"/>
  <line x1="600" y1="412" x2="600" y2="428" stroke="#a85a00" stroke-width="2"/>
  <line x1="204" y1="420" x2="396" y2="420" stroke="#a85a00" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="404" y1="420" x2="596" y2="420" stroke="#a85a00" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="300" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#a85a00">LIFT_STRIDE</text>
  <text x="500" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#a85a00">LIFT_STRIDE</text>
  <line x1="204" y1="460" x2="596" y2="460" stroke="#a85a00" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="400" y="478" text-anchor="middle" font-size="12" fill="#a85a00">half-stride, measured from under the hip · lab 3 step length = 2 × LIFT_STRIDE · trot: 0.05 m</text>

  <g transform="translate(0,38)">
  <!-- phase strip -->
  <line x1="40" y1="482" x2="860" y2="482" stroke="#ddd"/>
  <text x="450" y="508" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a2a8a">LIFT_TOUCHDOWN = (FR, FL, BR, LB): the phase at which each leg is at Touch Down</text>
  <text x="450" y="527" text-anchor="middle" font-size="12" fill="#6a2a8a">Example below: the trot, (0.0, 0.5, 0.5, 0.0). Each foot spends 4/6 of the cycle in stance, 2/6 in swing. Same idea as lab 3's leg-timing sliders.</text>

  <g font-size="14" fill="#222" text-anchor="end">
    <text x="150" y="563">FR  0.0</text>
    <text x="150" y="598">FL  0.5</text>
    <text x="150" y="633">BR  0.5</text>
    <text x="150" y="668">LB  0.0</text>
  </g>
  <!-- FR: stance 0-0.667, swing 0.667-1 -->
  <rect x="160" y="547" width="400" height="22" fill="#8b1a1a"/>
  <rect x="560" y="547" width="200" height="22" fill="#e9c9c9"/>
  <!-- FL: stance 0.5-1 and 0-0.167, swing 0.167-0.5 -->
  <rect x="460" y="582" width="300" height="22" fill="#8b1a1a"/>
  <rect x="160" y="582" width="100" height="22" fill="#8b1a1a"/>
  <rect x="260" y="582" width="200" height="22" fill="#e9c9c9"/>
  <!-- BR -->
  <rect x="460" y="617" width="300" height="22" fill="#8b1a1a"/>
  <rect x="160" y="617" width="100" height="22" fill="#8b1a1a"/>
  <rect x="260" y="617" width="200" height="22" fill="#e9c9c9"/>
  <!-- LB -->
  <rect x="160" y="652" width="400" height="22" fill="#8b1a1a"/>
  <rect x="560" y="652" width="200" height="22" fill="#e9c9c9"/>
  <!-- touchdown markers -->
  <g fill="#6a2a8a">
    <path d="M154,539 L166,539 L160,547 z"/>
    <path d="M454,574 L466,574 L460,582 z"/>
    <path d="M454,609 L466,609 L460,617 z"/>
    <path d="M154,644 L166,644 L160,652 z"/>
  </g>
  <!-- axis -->
  <line x1="160" y1="684" x2="760" y2="684" stroke="#333"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <line x1="160" y1="680" x2="160" y2="688" stroke="#333"/><text x="160" y="702">0</text>
    <line x1="310" y1="680" x2="310" y2="688" stroke="#333"/><text x="310" y="702">0.25</text>
    <line x1="460" y1="680" x2="460" y2="688" stroke="#333"/><text x="460" y="702">0.5</text>
    <line x1="610" y1="680" x2="610" y2="688" stroke="#333"/><text x="610" y="702">0.75</text>
    <line x1="760" y1="680" x2="760" y2="688" stroke="#333"/><text x="760" y="702">1</text>
    <text x="460" y="717">gait phase</text>
  </g>
  <!-- legend -->
  <rect x="785" y="560" width="18" height="14" fill="#8b1a1a"/><text x="808" y="572" font-size="12" fill="#222">stance</text>
  <rect x="785" y="584" width="18" height="14" fill="#e9c9c9"/><text x="808" y="596" font-size="12" fill="#222">swing</text>
  <path d="M788,608 L800,608 L794,616 z" fill="#6a2a8a"/><text x="808" y="617" font-size="12" fill="#222">touch</text>
  <text x="808" y="631" font-size="12" fill="#222">down</text>
</g>
</svg>
