<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ======================= LEFT PANEL: camera frame ======================= -->
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#222222">1. Is something in the way?</text>
  <text x="40" y="54" font-size="12" fill="#666666">what the camera sees (find_blocking_obstacle)</text>

  <!-- image frame -->
  <rect x="40" y="70" width="380" height="310" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>

  <!-- bottom margin band -->
  <rect x="40" y="312" width="380" height="68" fill="#ffcdd2" opacity="0.45"/>
  <text x="415" y="372" text-anchor="end" font-size="10.5" fill="#b71c1c">OBSTACLE_BOTTOM_MARGIN</text>

  <!-- center band -->
  <rect x="175" y="70" width="110" height="310" fill="#bbdefb" opacity="0.4"/>
  <text x="230" y="86" text-anchor="middle" font-size="10.5" fill="#0d47a1">OBSTACLE_CENTER_BAND</text>

  <!-- centerline + halves -->
  <line x1="230" y1="92" x2="230" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="105" y="106" text-anchor="middle" font-size="10.5" fill="#78909c">left half</text>
  <text x="355" y="106" text-anchor="middle" font-size="10.5" fill="#78909c">right half</text>

  <!-- lower = closer arrow -->
  <line x1="66" y1="150" x2="66" y2="360" stroke="#777777" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="58" y="255" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 58 255)">lower in image = closer on the floor</text>

  <!-- target box -->
  <rect x="250" y="130" width="58" height="115" fill="#c8e6c9" opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="279" cy="152" r="10" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <line x1="279" y1="162" x2="279" y2="205" stroke="#2e7d32" stroke-width="2"/>
  <line x1="264" y1="180" x2="294" y2="180" stroke="#2e7d32" stroke-width="2"/>
  <line x1="279" y1="205" x2="266" y2="233" stroke="#2e7d32" stroke-width="2"/>
  <line x1="279" y1="205" x2="292" y2="233" stroke="#2e7d32" stroke-width="2"/>
  <text x="279" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">target (person)</text>
  <!-- target bottom edge -->
  <line x1="250" y1="245" x2="308" y2="245" stroke="#2e7d32" stroke-width="3.5"/>
  <line x1="308" y1="245" x2="420" y2="245" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="415" y="226" text-anchor="end" font-size="11" fill="#2e7d32">target bottom</text>
  <text x="415" y="239" text-anchor="end" font-size="11" fill="#2e7d32">edge = farther</text>

  <!-- obstacle box -->
  <rect x="150" y="185" width="105" height="140" fill="#ffe0b2" opacity="0.6" stroke="#ef6c00" stroke-width="2"/>
  <rect x="170" y="215" width="52" height="8" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <line x1="174" y1="223" x2="174" y2="300" stroke="#ef6c00" stroke-width="2"/>
  <line x1="218" y1="223" x2="218" y2="300" stroke="#ef6c00" stroke-width="2"/>
  <line x1="166" y1="262" x2="226" y2="262" stroke="#ef6c00" stroke-width="2"/>
  <text x="202" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">obstacle (chair)</text>
  <!-- obstacle bottom edge -->
  <line x1="150" y1="325" x2="255" y2="325" stroke="#ef6c00" stroke-width="3.5"/>
  <line x1="255" y1="325" x2="420" y2="325" stroke="#ef6c00" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="415" y="304" text-anchor="end" font-size="11" fill="#e65100">obstacle bottom</text>
  <text x="415" y="317" text-anchor="end" font-size="11" fill="#e65100">edge = nearer</text>

  <!-- checklist -->
  <text x="40" y="410" font-size="12.5" fill="#333333"><tspan font-weight="bold" fill="#2e7d32">1. between</tspan> — its bottom edge is below the target&#8217;s (it is in front)</text>
  <text x="40" y="431" font-size="12.5" fill="#333333"><tspan font-weight="bold" fill="#b71c1c">2. close</tspan> — its bottom edge is inside OBSTACLE_BOTTOM_MARGIN</text>
  <text x="40" y="452" font-size="12.5" fill="#333333"><tspan font-weight="bold" fill="#0d47a1">3. ahead</tspan> — it sits inside OBSTACLE_CENTER_BAND &#8594; time to detour</text>

  <!-- ======================= RIGHT PANEL: top-down detour ======================= -->
  <text x="480" y="34" font-size="17" font-weight="bold" fill="#222222">2. The detour</text>
  <text x="480" y="54" font-size="12" fill="#666666">top-down view — three timed states, then the chase resumes</text>

  <!-- target -->
  <circle cx="680" cy="100" r="9" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <line x1="680" y1="109" x2="680" y2="132" stroke="#2e7d32" stroke-width="2"/>
  <text x="680" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">target</text>

  <!-- obstacle -->
  <circle cx="680" cy="272" r="30" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="680" y="276" text-anchor="middle" font-size="11" fill="#e65100">obstacle</text>

  <!-- blocked direct line -->
  <line x1="680" y1="400" x2="680" y2="140" stroke="#c62828" stroke-width="1.3" stroke-dasharray="6,5" opacity="0.75"/>
  <line x1="672" y1="330" x2="688" y2="346" stroke="#c62828" stroke-width="2.5"/>
  <line x1="688" y1="330" x2="672" y2="346" stroke="#c62828" stroke-width="2.5"/>
  <text x="698" y="342" font-size="11" fill="#c62828">blocked</text>

  <!-- robot -->
  <rect x="668" y="408" width="24" height="30" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="705" y="428" font-size="12" font-weight="bold" fill="#1565c0">Pupper</text>

  <!-- path: TRACK in -->
  <line x1="680" y1="408" x2="680" y2="388" stroke="#1565c0" stroke-width="3"/>
  <!-- AVOID_TURN -->
  <path d="M680,388 Q680,370 666,356" fill="none" stroke="#7b1fa2" stroke-width="3"/>
  <text x="658" y="384" text-anchor="end" font-size="12" font-weight="bold" fill="#7b1fa2">AVOID_TURN</text>
  <text x="658" y="399" text-anchor="end" font-size="10.5" fill="#7b1fa2">side from choose_side()</text>
  <!-- AVOID_PASS -->
  <line x1="666" y1="356" x2="592" y2="282" stroke="#7b1fa2" stroke-width="3"/>
  <text x="618" y="330" text-anchor="end" font-size="12" font-weight="bold" fill="#7b1fa2">AVOID_PASS</text>
  <!-- AVOID_RETURN -->
  <path d="M592,282 Q578,268 578,248" fill="none" stroke="#7b1fa2" stroke-width="3"/>
  <text x="566" y="262" text-anchor="end" font-size="12" font-weight="bold" fill="#7b1fa2">AVOID_RETURN</text>
  <text x="566" y="277" text-anchor="end" font-size="10.5" fill="#7b1fa2">same time &amp; speed as the turn:</text>
  <text x="566" y="291" text-anchor="end" font-size="10.5" fill="#7b1fa2">heading restored, shifted sideways</text>
  <!-- TRACK resumes -->
  <path d="M578,248 L578,210 Q578,146 662,116" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrblue)"/>
  <text x="566" y="190" text-anchor="end" font-size="12" font-weight="bold" fill="#1565c0">TRACK resumes</text>
</svg>
