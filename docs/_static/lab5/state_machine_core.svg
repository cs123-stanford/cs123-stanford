<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- initial-state marker -->
  <circle cx="125" cy="45" r="7" fill="#444444"/>
  <line x1="125" y1="52" x2="125" y2="97" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- IDLE -->
  <rect x="50" y="100" width="150" height="84" rx="12" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="125" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#37474f">IDLE</text>
  <text x="125" y="150" text-anchor="middle" font-size="11.5" fill="#455a64">stand still,</text>
  <text x="125" y="166" text-anchor="middle" font-size="11.5" fill="#455a64">publish nothing</text>

  <!-- SEARCH -->
  <rect x="305" y="100" width="150" height="84" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="380" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">SEARCH</text>
  <text x="380" y="150" text-anchor="middle" font-size="11.5" fill="#8d5524">rotate in place,</text>
  <text x="380" y="166" text-anchor="middle" font-size="11.5" fill="#8d5524">toward last-seen side</text>

  <!-- TRACK -->
  <rect x="560" y="100" width="150" height="84" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="635" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">TRACK</text>
  <text x="635" y="150" text-anchor="middle" font-size="11.5" fill="#33691e">walk forward,</text>
  <text x="635" y="166" text-anchor="middle" font-size="11.5" fill="#33691e">steer against offset</text>

  <!-- IDLE -> SEARCH -->
  <line x1="200" y1="122" x2="301" y2="122" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="251" y="112" text-anchor="middle" font-size="12.5" fill="#333333">begin_tracking()</text>

  <!-- SEARCH -> IDLE -->
  <line x1="305" y1="162" x2="204" y2="162" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="254" y="182" text-anchor="middle" font-size="12.5" fill="#333333">end_tracking()</text>

  <!-- SEARCH -> TRACK -->
  <line x1="455" y1="122" x2="556" y2="122" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="506" y="112" text-anchor="middle" font-size="12.5" fill="#333333">target detected</text>

  <!-- TRACK -> SEARCH -->
  <line x1="560" y1="162" x2="459" y2="162" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="509" y="180" text-anchor="middle" font-size="12.5" fill="#333333">no detection for</text>
  <text x="509" y="195" text-anchor="middle" font-size="12.5" fill="#333333">TIMEOUT seconds</text>

  <!-- TRACK -> IDLE (bottom arc) -->
  <path d="M635,184 C635,262 125,262 125,188" fill="none" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="380" y="256" text-anchor="middle" font-size="12.5" fill="#333333">end_tracking()</text>
</svg>
