<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="#ffffff"/>

  <!-- the part students build -->
  <rect x="400" y="36" width="200" height="160" rx="16" fill="none" stroke="#f9a825" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">you build this</text>

  <!-- YOU -->
  <rect x="20" y="70" width="130" height="90" rx="12" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="85" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#37474f">YOU</text>
  <text x="85" y="126" text-anchor="middle" font-size="11.5" fill="#455a64">voice, and what</text>
  <text x="85" y="142" text-anchor="middle" font-size="11.5" fill="#455a64">the camera sees</text>

  <!-- GEMINI -->
  <rect x="200" y="70" width="150" height="90" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="275" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">GEMINI LIVE</text>
  <text x="275" y="122" text-anchor="middle" font-size="11.5" fill="#1a4f8b">listens, looks, talks,</text>
  <text x="275" y="138" text-anchor="middle" font-size="11.5" fill="#1a4f8b">and picks a tool</text>

  <!-- GEMINI PUPPER -->
  <rect x="410" y="70" width="180" height="90" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">GEMINI PUPPER</text>
  <text x="500" y="122" text-anchor="middle" font-size="11.5" fill="#8d5524">lab/: prompt, tools,</text>
  <text x="500" y="138" text-anchor="middle" font-size="11.5" fill="#8d5524">checks, the queue, jobs</text>

  <!-- ON THE ROBOT: ROS 2 controllers running the policies -->
  <rect x="670" y="70" width="230" height="90" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="785" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">ROS 2 POLICIES</text>
  <text x="785" y="122" text-anchor="middle" font-size="11.5" fill="#33691e">locomotion or tracking mode:</text>
  <text x="785" y="138" text-anchor="middle" font-size="11.5" fill="#33691e">the policy moves the 12 motors</text>

  <!-- forward arrows -->
  <line x1="150" y1="100" x2="196" y2="100" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="100" x2="406" y2="100" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="378" y="78" text-anchor="middle" font-size="11" fill="#333333">function</text>
  <text x="378" y="91" text-anchor="middle" font-size="11" fill="#333333">call</text>
  <line x1="590" y1="100" x2="666" y2="100" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="634" y="91" text-anchor="middle" font-size="11" fill="#333333">jobs</text>
  <line x1="666" y1="138" x2="594" y2="138" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="634" y="156" text-anchor="middle" font-size="11" fill="#333333">state, falls</text>

  <!-- Gemini back to you -->
  <line x1="196" y1="138" x2="154" y2="138" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="175" y="156" text-anchor="middle" font-size="11" fill="#333333">says</text>

  <!-- the reply -->
  <polyline points="500,160 500,236 275,236 275,164" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="256" text-anchor="middle" font-size="13" fill="#b71c1c">the reply {success, message}: how Gemini gets feedback on what really happened</text>
  <text x="470" y="276" text-anchor="middle" font-size="11.5" fill="#555555">(a refusal with a reason, it can explain; a silent failure, it will cover up)</text>
</svg>
