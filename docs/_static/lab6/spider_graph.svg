<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- the one state Gemini Pupper sees -->
  <rect x="120" y="14" width="690" height="372" rx="18" fill="#faf5fc" stroke="#7b1fa2" stroke-width="2.2" stroke-dasharray="9 6"/>
  <text x="465" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">To Gemini Pupper, all of this is ONE state: trick spider_walk</text>
  <text x="465" y="56" text-anchor="middle" font-size="11.5" fill="#5e2a72">two policies take turns holding the legs; robot.state_now stays the trick the whole time</text>

  <!-- legend -->
  <rect x="140" y="72" width="14" height="14" rx="3" fill="#ede7f6" stroke="#7b1fa2"/>
  <text x="160" y="84" font-size="11.5" fill="#333333">clip policy (trick_spider_walk): your clips, Part A</text>
  <rect x="480" y="72" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="500" y="84" font-size="11.5" fill="#333333">walking policy (walk_spider_walk): Part B</text>

  <!-- entering -->
  <circle cx="22" cy="245" r="7" fill="#444444"/>
  <line x1="29" y1="245" x2="146" y2="245" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="58" y="232" text-anchor="middle" font-size="11.5" fill="#333333">play_trick</text>
  <text x="58" y="264" text-anchor="middle" font-size="11" fill="#333333">(from locomotion)</text>

  <!-- spider_down -->
  <rect x="150" y="215" width="140" height="60" rx="12" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2"/>
  <text x="220" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a148c">spider_down</text>
  <text x="220" y="261" text-anchor="middle" font-size="11" fill="#5e2a72">lie down, wiggle, settle</text>

  <!-- spider_idle -->
  <rect x="330" y="215" width="120" height="60" rx="12" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2"/>
  <text x="390" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a148c">spider_idle</text>
  <text x="390" y="261" text-anchor="middle" font-size="11" fill="#5e2a72">the stance, still</text>
  <line x1="290" y1="245" x2="326" y2="245" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="308" y="236" text-anchor="middle" font-size="11" fill="#333333">next</text>

  <!-- spider walk -->
  <rect x="500" y="215" width="150" height="60" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="575" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">the spider walk</text>
  <text x="575" y="261" text-anchor="middle" font-size="11" fill="#33691e">low and splayed, stepping</text>
  <line x1="450" y1="245" x2="496" y2="245" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="474" y="206" text-anchor="middle" font-size="11" fill="#333333">hands over</text>
  <text x="474" y="220" text-anchor="middle" font-size="11" fill="#333333">the legs</text>
  <path d="M 550 275 C 530 330, 620 330, 600 279" fill="none" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="575" y="344" text-anchor="middle" font-size="11.5" fill="#333333">move, turn, arc: walk slowly,</text>
  <text x="575" y="358" text-anchor="middle" font-size="11.5" fill="#333333">and stay in the trick</text>

  <!-- spider_up -->
  <rect x="660" y="110" width="130" height="60" rx="12" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2"/>
  <text x="725" y="137" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a148c">spider_up</text>
  <text x="725" y="156" text-anchor="middle" font-size="11" fill="#5e2a72">exit clip: wiggle, stand</text>
  <line x1="610" y1="215" x2="690" y2="174" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="150" text-anchor="end" font-size="11" fill="#333333">interactive_action("spider_up"),</text>
  <text x="600" y="164" text-anchor="end" font-size="11" fill="#333333">stand_up, or any other motion:</text>
  <text x="600" y="178" text-anchor="end" font-size="11" fill="#333333">the clip policy, started there (start_clip)</text>

  <!-- leaving -->
  <rect x="840" y="110" width="105" height="60" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="892" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">locomotion</text>
  <text x="892" y="155" text-anchor="middle" font-size="11" fill="#1a4f8b">mode</text>
  <line x1="790" y1="140" x2="836" y2="140" stroke="#444444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="823" y="131" text-anchor="middle" font-size="11" fill="#333333">ends</text>
</svg>
